version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/hubcap-store
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
      JWT_EXPIRE: 30d
      STRIPE_SECRET_KEY: sk_test_your_stripe_secret_key_here
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:      
      - VITE_API_URL=http://localhost:5001/api
    depends_on:      
      - backend

  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data: